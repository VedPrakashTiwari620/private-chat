name: 🤖 Build Android APK

# Trigger: manually from GitHub UI, OR on every push to main
on:
  push:
    branches: [main]
  workflow_dispatch:   # ← "Run workflow" button in GitHub Actions tab

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ──────────────────────────────────────────────
      - name: 🟢 Setup Node.js 22 (required by Capacitor CLI v8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      # ── 3. Setup Java (required for Gradle / Android build) ───────────
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── 4. Setup Android SDK ──────────────────────────────────────────
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Create .env file from GitHub Secrets ───────────────────────
      #    Go to: GitHub repo → Settings → Secrets and variables → Actions
      #    Add these 3 secrets: VITE_USER1_UID, VITE_USER2_UID, VITE_AES_SECRET
      - name: 🔐 Create .env file from secrets
        working-directory: ./client
        run: |
          cat > .env << EOF
          VITE_USER1_UID=${{ secrets.VITE_USER1_UID }}
          VITE_USER2_UID=${{ secrets.VITE_USER2_UID }}
          VITE_AES_SECRET=${{ secrets.VITE_AES_SECRET }}
          EOF
          echo "✅ .env file created"

      # ── 6. Install client npm packages ────────────────────────────────
      - name: 📦 Install client dependencies
        working-directory: ./client
        run: npm ci

      # ── 7. Build React app → dist/ (what Capacitor's webDir expects) ──
      # Note: vite.config.js normally outputs to ../public for the server,
      # but for Capacitor APK build we output to dist/ instead.
      # The APK uses live server URL (capacitor.config.json → server.url),
      # so dist/ just needs valid assets for cap sync to proceed.
      - name: ⚛️ Build React app → dist/ for Capacitor
        working-directory: ./client
        run: npx vite build --outDir dist --emptyOutDir

      # ── 8. Sync dist/ assets into Android project ─────────────────────
      - name: 🔄 Capacitor sync → Android
        working-directory: ./client
        run: npx cap sync android

      # ── 9. Create local.properties (Android SDK path for Gradle) ─────────
      - name: 📝 Create local.properties
        working-directory: ./client/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ── 10. Make Gradle wrapper executable ─────────────────────────
      - name: 🔧 Grant Gradle execute permission
        working-directory: ./client/android
        run: chmod +x ./gradlew

      # ── 11. Build Debug APK ────────────────────────────────────────────
      - name: 🏗️ Build Debug APK
        working-directory: ./client/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -x lint -x lintDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 12. Upload APK as downloadable artifact ────────────────────────
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCapBank-App-v${{ github.run_number }}
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30   # APK available for 30 days to download
          if-no-files-found: error

      # ── 12. Print download reminder ───────────────────────────────────
      - name: ✅ Build complete — download instructions
        run: |
          echo "=============================================="
          echo "  APK BUILD SUCCESSFUL!"
          echo "=============================================="
          echo ""
          echo "  To download your APK:"
          echo "  1. Go to GitHub → Actions tab"
          echo "  2. Click this workflow run"
          echo "  3. Scroll down to 'Artifacts' section"
          echo "  4. Click 'GCapBank-App-v${{ github.run_number }}' to download"
          echo "  5. Unzip → transfer app-debug.apk to phone"
          echo "  6. On phone: Settings → Install Unknown Apps → Allow"
          echo ""
          echo "=============================================="
